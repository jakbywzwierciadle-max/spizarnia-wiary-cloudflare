name: Download latest audio and upload to R2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl ffmpeg
    
      - name: Fetch latest 2 video IDs
        run: |
          curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCO6_hwMtQZ0SLElfDMaqJGQ" \
            | grep -oP '(?<=<yt:videoId>).*?(?=</yt:videoId>)' \
            | head -n 2 > video_ids.txt

          echo "Fetched video IDs:"
          cat video_ids.txt

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
    
      - name: Write cookies to file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "${YOUTUBE_COOKIES}" > cookies.txt

      - name: Download audio via public API
        run: |
          mkdir -p output

          while read ID; do
            echo "Processing video ID: $ID"

            curl -L "https://piped.video/api/v1/download?url=https://www.youtube.com/watch?v=$ID&itag=140" \
              -o "output/$ID.m4a"

            echo "Converting to MP3"
            ffmpeg -i "output/$ID.m4a" -vn -ab 128k "output/$ID.mp3"

            rm "output/$ID.m4a"
          done < video_ids.txt

          ls -l output



      - name: Upload to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: spizarnia-wiary-audio
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto

          for f in output/*.mp3; do
            echo "Uploading $f"
            aws s3 cp "$f" \
              "s3://${R2_BUCKET}/$(basename "$f")" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done

