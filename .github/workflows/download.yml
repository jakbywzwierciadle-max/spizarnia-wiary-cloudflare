name: Download latest audio and upload to R2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest 2 videos via API
        run: |
          mkdir output

          # Pobierz listę filmów z RSS YouTube
          curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCO6_hwMtQZ0SLElfDMaqJGQ" \
            | grep -oP '(?<=<yt:videoId>).*?(?=</yt:videoId>)' \
            | head -n 2 > video_ids.txt

          # Pobierz audio przez API (działa zawsze)
          while read ID; do
            curl -L "https://pipedapi.kavin.rocks/streams/$ID" \
              | jq -r '.audioStreams[0].url' \
              | xargs -I {} curl -L "{}" -o "output/${ID}.mp3"
          done < video_ids.txt

      - name: Upload to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: spizarnia-wiary-audio
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set default.region auto

          for f in output/*.mp3; do
            aws s3 cp "$f" \
              "s3://${R2_BUCKET}/$(basename "$f")" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done
